[package]
name = "just-notes"
version = "0.1.0"
description = "Local-first live transcription notes"
authors = ["Just Notes"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "just_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }

[features]
qa-fixtures = []

[dependencies]
block2 = "0.6.2"
cpal = "0.17.3"
hound = "3.5.1"
reqwest = { version = "0.12.15", default-features = false, features = ["blocking", "rustls-tls"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSColor", "NSColorSpace", "NSPasteboard", "NSResponder", "NSWindow", "NSWorkspace"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["AudioHardware", "objc2", "objc2-foundation", "std"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSNotification", "NSOperation", "NSString", "NSURL", "NSUUID", "block2", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
sherpa-onnx = "1.13.3"
tauri = { version = "2.9.3", features = ["tray-icon"] }
tar = "0.4.44"
ts-rs = "12.0.1"
bzip2 = "0.6.1"
objc2-event-kit = "0.3.2"
objc2-user-notifications = "0.3.2"
