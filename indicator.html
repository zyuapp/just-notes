<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recording</title>
  </head>
  <body>
    <div class="indicator-pill" id="pill" title="Recording — click to open Just Notes">
      <span class="indicator-time">
        <span id="minutes">00</span><span class="indicator-colon">:</span><span id="seconds">00</span>
      </span>
      <button class="indicator-stop" id="stop" title="Stop recording" aria-label="Stop recording">
        <span></span>
      </button>
    </div>
    <script type="module" src="/src/indicator/main.ts"></script>
  </body>
</html>
